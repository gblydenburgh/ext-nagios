###############################################################################
# Extra checks run by the external Nagios server
#
# These checks answer two questions:
#   1. Can the outside world reach important services at home?
#   2. Is this Nagios server healthy enough to keep watching the home network?
#
# The checks use standard Nagios plugins. No password or webhook is stored here.
###############################################################################


###############################################################################
# COMMANDS
###############################################################################

# Ask an outside DNS server to resolve a public name.
define command {
    command_name    check_external_dns
    command_line    $USER1$/check_dns -H $ARG1$ -s $ARG2$
}

# Open a public HTTPS site, follow redirects, and require a final HTTP 200 page.
# SNI tells a shared web server which certificate and website we want.
define command {
    command_name    check_public_https
    command_line    $USER1$/check_http -I $HOSTADDRESS$ -H $ARG1$ -S --sni -f follow -u $ARG2$ -e 200 -w 5 -c 10
}

# Warn before a public TLS certificate expires. ARG2 is the warning day count,
# and ARG3 is the critical day count.
define command {
    command_name    check_public_certificate
    command_line    $USER1$/check_http -H $ARG1$ -S --sni -C $ARG2$,$ARG3$
}

# Open a protected HTTPS page and require its login challenge. HTTP 401 is the
# expected answer because it proves the site is online and still requires login.
define command {
    command_name    check_protected_https
    command_line    $USER1$/check_http -H $ARG1$ -S --sni -u $ARG2$ -e 401 -w 5 -c 10
}

# At least one Nagios process must exist. Nagios also has worker processes, so
# the check accepts any count of one or more.
define command {
    command_name    check_nagios_process
    command_line    $USER1$/check_procs -c 1: -C nagios
}

# Compare this server's clock with a public time server.
define command {
    command_name    check_public_time
    command_line    $USER1$/check_ntp_time -H $ARG1$ -w $ARG2$ -c $ARG3$
}

# Report operating-system packages that are waiting for an upgrade.
define command {
    command_name    check_package_updates
    command_line    $USER1$/check_apt
}

# Compare the installed Nagios Core version with the newest stable release.
# The script uses the official Nagios Core GitHub project and needs no token.
define command {
    command_name    check_nagios_version
    command_line    /usr/local/nagios/etc/scripts/check-nagios-version.py
}


###############################################################################
# HOME NETWORK CHECKS
###############################################################################

# This proves that the public home name still resolves through an outside DNS
# provider. It helps separate a DNS failure from a full ISP outage.
define service {
    use                     local-service
    host_name               firewall
    service_description     Public DNS
    check_command           check_external_dns!blydenburgh.com!1.1.1.1
    check_interval          5
    retry_interval          1
    max_check_attempts      3
}

# This proves that a real application at home works from the public Internet.
# A ping alone only proves that the firewall answered an ICMP packet.
define service {
    use                     local-service
    host_name               firewall
    service_description     GitLab HTTPS
    check_command           check_public_https!gitlab.blydenburgh.com!/
    check_interval          5
    retry_interval          1
    max_check_attempts      3
}

# Check the GitLab certificate once per day. Nagios time units are minutes, so
# 1440 means one day. Warn at 30 days and go critical at 14 days.
define service {
    use                     local-service
    host_name               firewall
    service_description     GitLab TLS Certificate
    check_command           check_public_certificate!gitlab.blydenburgh.com!30!14
    check_interval          1440
    retry_interval          60
    max_check_attempts      2
    notification_interval   1440
}


###############################################################################
# EXTERNAL NAGIOS SERVER CHECKS
###############################################################################

# Make sure the Nagios program is still running on this server.
define service {
    use                     local-service
    host_name               localhost
    service_description     Nagios Process
    check_command           check_nagios_process
    check_interval          5
    retry_interval          1
    max_check_attempts      2
}

# Check once per day for a newer stable Nagios Core release. A WARNING means
# an upgrade is available. UNKNOWN means the release lookup could not finish,
# which also needs attention because a failed check must not look healthy.
define service {
    use                     local-service
    host_name               localhost
    service_description     Nagios Version
    check_command           check_nagios_version
    check_interval          1440
    retry_interval          60
    max_check_attempts      2
    notification_interval   1440
}

# Check clock accuracy once per hour. Accurate time makes alerts and logs much
# easier to compare. Warn at one second and go critical at five seconds.
define service {
    use                     local-service
    host_name               localhost
    service_description     Time Synchronization
    check_command           check_public_time!time.cloudflare.com!1!5
    check_interval          60
    retry_interval          5
    max_check_attempts      2
    notification_interval   120
}

# Check for package updates once per day. Repeat an unresolved warning once per
# day instead of sending the default hourly reminder.
define service {
    use                     local-service
    host_name               localhost
    service_description     Package Updates
    check_command           check_package_updates
    check_interval          1440
    retry_interval          60
    max_check_attempts      1
    notification_interval   1440
}

# Check the public Nagios certificate once per day so failed automatic renewal
# is noticed before browsers start rejecting the site.
define service {
    use                     local-service
    host_name               localhost
    service_description     Nagios TLS Certificate
    check_command           check_public_certificate!ext.blydenburgh.com!30!14
    check_interval          1440
    retry_interval          60
    max_check_attempts      2
    notification_interval   1440
}
