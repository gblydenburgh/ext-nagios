###############################################################################
# Discord notification commands
#
# Nagios puts the host and service details into environment variables.
# The Python script reads those variables and sends a short Discord message.
###############################################################################

define command {
    command_name    notify-host-by-discord
    command_line    /usr/local/nagios/etc/scripts/notify-discord.py host
}

define command {
    command_name    notify-service-by-discord
    command_line    /usr/local/nagios/etc/scripts/notify-discord.py service
}
